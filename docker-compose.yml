services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: techblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_blog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techblog-network

  # 2. Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techblog-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # Khi chạy trong Docker network, backend kết nối đến postgres qua tên service 'postgres' và port nội bộ 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/course_blog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      # Ánh xạ thư mục uploads ra máy chủ thật để ảnh không bị mất khi restart container
      - ./uploads:/app/uploads
    networks:
      - techblog-network

volumes:
  postgres_data:

networks:
  techblog-network:
    driver: bridge
