services:
  postgres:
    image: postgres:16-alpine
    container_name: techblog-postgres
    environment:
      POSTGRES_USER: courser_blog
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: courser_blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: