server {
    listen 80;
    server_name localhost;

    # Thư mục chứa mã nguồn giao diện sau khi build (dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Bật Gzip nén dữ liệu giúp tải trang siêu nhanh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Reverse Proxy các API sang Backend Spring Boot container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cho phép tải file lên tới 20MB
        client_max_body_size 20M;
    }

    # 2. Cache các file tĩnh (JS, CSS, hình ảnh, font) để tối ưu hiệu năng
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Hỗ trợ Single Page Application (SPA - React Router)
    # Nếu không tìm thấy file thật, tự động fallback về index.html để React Router xử lý định tuyến
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Trang lỗi 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
